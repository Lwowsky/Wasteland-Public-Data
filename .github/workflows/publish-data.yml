
name: Publish Wasteland public JSON only

on:
  repository_dispatch:
    types: [public_snapshot_changed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wasteland-public-json-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download authorized public snapshot
        env:
          EXPORT_URL: ${{ vars.PUBLIC_SNAPSHOT_EXPORT_URL }}
          EXPORT_TOKEN: ${{ secrets.PUBLIC_SNAPSHOT_EXPORT_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPORT_URL" =~ ^https:// ]] || [[ -z "$EXPORT_TOKEN" ]]; then
            echo 'Missing PUBLIC_SNAPSHOT_EXPORT_URL or PUBLIC_SNAPSHOT_EXPORT_TOKEN'
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 --max-time 30 \
            -H "Authorization: Bearer $EXPORT_TOKEN" \
            "${EXPORT_URL%/}/api/internal/public-snapshot" \
            -o snapshot.json

      - name: Create ONLY public JSON files
        run: |
          set -euo pipefail
          mkdir -p site/data

          python3 - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(
              Path('snapshot.json').read_text(encoding='utf-8')
          )

          revision = snapshot['revision']

          if not isinstance(revision, int) or revision < 1:
              raise ValueError('Missing positive snapshot revision')

          summary = dict(snapshot['summary'])
          recent = summary.pop('recentPlayers', [])

          players = snapshot['players']
          site_settings = snapshot.get('siteSettings')
          registration_settings = snapshot.get('registrationSettings')
          final_plan = snapshot.get('finalPlan')

          # Validate public site settings
          if not (
              isinstance(site_settings, dict)
              and site_settings.get('success') is True
              and isinstance(site_settings.get('settings'), dict)
              and isinstance(
                  site_settings['settings'].get('siteName'), str
              )
          ):
              raise ValueError(
                  'Missing PUBLIC site settings in Worker export'
              )

          # Validate public registration settings
          if not (
              isinstance(registration_settings, dict)
              and registration_settings.get('success') is True
              and isinstance(registration_settings.get('settings'), dict)
              and isinstance(
                  registration_settings.get('enabled'), bool
              )
              and isinstance(
                  registration_settings.get('period'), dict
              )
          ):
              raise ValueError(
                  'Missing PUBLIC registration settings in Worker export'
              )

          # Validate players
          if not isinstance(players, dict):
              raise ValueError('Invalid players snapshot')

          if not (
              isinstance(players.get('players'), list)
              and isinstance(recent, list)
          ):
              raise ValueError('Invalid public snapshot format')

          if (
              len(players['players']) > 500
              or int(players.get('total', 0))
              > len(players['players'])
          ):
              raise ValueError(
                  'More than 500 public players; export incomplete'
              )

          if players.get('accessMode') not in (
              'public', 'link', 'private', 'code'
          ):
              raise ValueError('Invalid player table access mode')

          # Validate final plan
          if not (
              isinstance(final_plan, dict)
              and final_plan.get('success') is True
              and final_plan.get('accessMode') in (
                  'public', 'link', 'private', 'code'
              )
          ):
              raise ValueError('Missing final plan access mode')

          # Static links are allowed to publish public-view data.
          # Closed and legacy password modes must not expose data.
          if (
              final_plan['accessMode'] in ('private', 'code')
              and final_plan.get('plan') is not None
          ):
              raise ValueError(
                  'Closed or password-protected plan must not be published'
              )

          if (
              players['accessMode'] in ('private', 'code')
              and players['players']
          ):
              raise ValueError(
                  'Closed or password-protected players must not be published'
              )

          output = Path('site/data')

          public_files = (
              (
                  'summary.json',
                  {
                      'stats': summary,
                      'recentPlayers': recent,
                  },
              ),
              ('players.json', players),
              ('site-settings.json', site_settings),
              ('registration-settings.json', registration_settings),
              ('final-plan.json', final_plan),
              ('revision.json', {'revision': revision}),
          )

          for name, public_data in public_files:
              (output / name).write_text(
                  json.dumps(
                      public_data,
                      ensure_ascii=False,
                      separators=(',', ':'),
                  ),
                  encoding='utf-8',
              )

          Path('site/index.html').write_text(
              '<!doctype html><title>Wasteland public data</title>',
              encoding='utf-8',
          )

          Path('site/.nojekyll').touch()

          print(
              f'Prepared revision {revision}; '
              f'{len(players["players"])} public players; '
              f'players mode={players["accessMode"]}; '
              f'final plan mode={final_plan["accessMode"]}'
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload tiny JSON-only artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish public JSON
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Acknowledge published revision to Cloudflare D1
        env:
          EXPORT_URL: ${{ vars.PUBLIC_SNAPSHOT_EXPORT_URL }}
          EXPORT_TOKEN: ${{ secrets.PUBLIC_SNAPSHOT_EXPORT_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          revision = json.loads(
              Path('site/data/revision.json').read_text(
                  encoding='utf-8'
              )
          )['revision']

          Path('ack.json').write_text(
              json.dumps({'revision': revision}),
              encoding='utf-8',
          )
          PY

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $EXPORT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @ack.json \
            "${EXPORT_URL%/}/api/internal/public-snapshot/ack"
